schema_version = 1

# validation/migrations/coordinate.toml
# FunctionCoordinate 坐标模块迁入清单（团队 static-small-change / t24）
#
# schema：`[[moves]]` 每行含 name / from / to / status / source_hash / target_hash / revision
#   from        —— 旧定义位置：5f225db 中的源文件（仓库相对 POSIX 路径）
#   to          —— 迁入目标：common/function_coordinate.jl 的 module FunctionCoordinate
#   name        —— 迁入后在 FunctionCoordinate 中的函数名
#   status      —— finalized：按 action 完成迁移或纯删除；pending：未完成
#   source_hash —— 旧定义在**源侧**的 AST 规范化 SHA-256（validation/ast canonical_hash 口径）
#   target_hash —— 迁入后定义在**目标侧**的 AST 规范化 SHA-256（与 source_hash 独立字段）
#   revision    —— 源侧修订锚点（本批统一为 5f225db）
#
# ⚠ 口径更正（沿用 t22 的裁定）：canonical_hash **只覆盖 AST 结构、不含 docstring**。
#   故 target_hash == source_hash 只能证明结构一致，**不能**推断文档保真；文档保真另以
#   test/coordinate_migration_test.jl 中「整块原文逐字文本对照」佐证。
#
# ⚠ module 包装的副作用（重要，供调用点迁移单元核对）：
#   common/function_coordinate.jl 在 5f225db 下**无** module 包装，include 后函数以裸名
#   落进宿主作用域。本批加了 `module FunctionCoordinate` 包装，故 include 之后裸名**不再**
#   自动可见，宿主需显式 `using .FunctionCoordinate`（模块已 export 全部公开名）。
#   已知受影响调用方（本任务不改，按 scope 留给调用点迁移单元）：
#     models/Pickup_ion.jl:4   include("../common/function_coordinate.jl")
#     models/Pickup_ion.jl:291 裸名 bowshock_zero(...)   ← 该名本次已迁往 Mars_Environment
#     models/Pickup_ion.jl:413 裸名 slice2d_cal_rot(...)
#
# bowshock_zero 的迁出（源侧删除）记录在 environment.toml，不在本清单重复登记目的端。

