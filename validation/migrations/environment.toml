schema_version = 1

# validation/migrations/environment.toml
# MarsEnvironment 权威文件迁入清单（团队 static-small-change / t7）
#
# schema：`[[moves]]` 每行含 from / to / name / status / source_hash
#   from        —— 旧定义位置：5f225db 中的源文件（仓库相对 POSIX 路径）
#   to          —— 迁入目标：MarsEnvironment 权威文件
#   name        —— 迁入后在 MarsEnvironment 中的函数名
#   status      —— pending：旧定义与旧文件仍在，由最终任务删除源并更新调用点
#   source_hash —— 5f225db 旧定义的 AST 规范化 SHA-256（validation/ast 同口径，大写十六进制）
#
# 口径：source_hash 由 validation/ast/ASTMigrate.jl 的 canonical_hash 计算
#   （去 LineNumberNode 的结构化序列化，与行号/缩进/换行无关）。
#   **注意：canonical_hash 只覆盖 AST 结构，不包含 docstring。** 因此 target_hash 相等
#   不能推断文档一致，反之文档增删也不会改变该哈希；文档保真必须另以「整块原文文本对照」
#   佐证（见 test/environment_migration_test.jl 的 bowshock_zero docstring 逐字比对断言）。
#   source_hash 仅用于溯源旧定义，目标侧校验用 target_hash（独立字段），二者不混用。
#   清单由 test/environment_migration_test.jl 逐行重算核对。
#
# 说明：solve_func 不在此登记为迁入项——权威文件已改为复用 MarsCommon 的实现
#   （common/marscommon/numerics.jl，经 `using .MarsCommon: solve_func` 引入，reused_from=MarsCommon），
#   该函数自身的迁移由 common.toml 负责，避免同一函数在两份清单重复登记目的端。
#
# bowshock_zero 源自 common/function_coordinate.jl（非 head.jl），归入同一权威文件。

[[moves]]
from        = "common/head.jl"
to          = "models/Mars_Environment.jl"
name        = "mars_sun_dist_phys"
status = "finalized"
target_hash = "7badb459a0db2e162591e781d27fe6ef26a9a58e6a352089a0d968ac17cadd03"
source_revision = "5f225db"
source_hash = "7BADB459A0DB2E162591E781D27FE6EF26A9A58E6A352089A0D968AC17CADD03"

