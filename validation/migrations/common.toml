# validation/migrations/common.toml
# MarsCommon 能力子文件迁入清单（团队 static-small-change / t9）
#
# schema：`[[moves]]` 每行含 from / to / name / status / source_hash
#   from        —— 源位置：5f225db 中的源文件（仓库相对 POSIX 路径）
#   to          —— 目标位置：迁入后的能力子文件
#   name        —— 迁入后在 MarsCommon 中的函数名
#   status      —— pending：源实现与调用方切换尚未清理，由最终集成单元完成
#   source_hash —— 该函数块全文（含 docstring）在 5f225db 下的 SHA-256 前 16 位（大写十六进制）
#   source_name —— 仅“改名迁入”的行出现：5f225db 中的原函数名（未出现时等于 name）
#
# 取界口径（与 test/common_migration_test.jl::extract_old_function 一致）：
#   自紧邻的 docstring 起始行起、到该函数自身的 `end`/`end;` 行为止，去除尾部空行与游离注释。
#   源文件为 CRLF，按原样（不做行尾归一）计算哈希。清单由测试逐行重算核对。

